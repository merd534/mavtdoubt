; Шаблон файла секретов. Скопируйте в secrets.cfg (он в .gitignore) и впишите свой токен.
; Приоритет источников токена (см. GameConfig.resolve_llm_token):
;   1. Переменная окружения NOIR_LLM_TOKEN
;   2. res://secrets.cfg
;   3. user://secrets.cfg
;   4. пусто -> игра автоматически уходит в offline-режим и использует
;      FallbackCrimeGenerator (полностью играбельно без сети)

[llm]

token=""
endpoint="https://models.inference.ai.azure.com/chat/completions"
model="gpt-4.1"
